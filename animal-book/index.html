<!doctype html>
<html lang="ja">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-HDPEGE2X1P"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-HDPEGE2X1P');</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>コレクション図鑑｜数学の扉</title>
<link rel="canonical" href="https://sakurak02.github.io/intellectual-toys/animal-book/">
<link rel="stylesheet" href="../css/site.css">
<style>
.shelf{margin-top:28px;padding:20px;border:1px solid var(--line);border-radius:20px;background:white}
.shelf-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:14px}.shelf-head h2{margin:0}.progress{color:#7b5b20;font-weight:800}
.book-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:8px}
.item-cell{min-width:0;height:94px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #e4ddcf;border-radius:12px;background:#fffefa}
.item-cell.acquired{border-color:#dca94b;background:#fff1c9}
.item-image{display:block;width:72%;height:64px;object-fit:contain}.placeholder{font-size:1.45rem;color:#d5ccba}.num{font-size:.72rem;color:#7a7f84;font-weight:800}
@media(max-width:650px){.book-grid{grid-template-columns:repeat(5,1fr);gap:7px}.shelf{padding:12px}.item-cell{height:88px}}
</style>
</head>
<body>
<main class="page">
  <a class="back" href="../">← 数学の扉へ</a>
  <header class="site-header">
    <h1>📖 コレクション図鑑</h1>
    <p class="tagline">扉のチャレンジに正解すると、少しずつ仲間が増えていきます。</p>
  </header>

  <section class="shelf" aria-labelledby="animal-title">
    <div class="shelf-head"><h2 id="animal-title">どうぶつ図鑑</h2><div class="progress" id="animalProgress">0 / 50</div></div>
    <div class="book-grid" id="animalGrid"></div>
  </section>

  <section class="shelf" aria-labelledby="dino-title">
    <div class="shelf-head"><h2 id="dino-title">恐竜図鑑</h2><div class="progress" id="dinoProgress">0 / 20</div></div>
    <div class="book-grid" id="dinoGrid"></div>
  </section>

  <p class="section-lead" style="margin-top:22px;text-align:center">取得記録はこのブラウザに保存されます。同じ端末・同じブラウザで続きから集められます。</p>
  <footer>数学の扉</footer>
</main>
<script src="../js/collection.js"></script>
<script>
(() => {
  const state=window.MathDoorCollection.readState();
  const knownAnimalImages=new Set(Array.from({length:30},(_,i)=>String(i+1).padStart(3,'0')));
  function render(gridId,progressId,category,count,imagePrefix){
    const grid=document.getElementById(gridId);const acquired=new Set(state[category]||[]);
    let valid=0;
    for(let i=1;i<=count;i++){
      const id=String(i).padStart(3,'0');const got=acquired.has(id);if(got) valid++;
      const cell=document.createElement('div');cell.className='item-cell'+(got?' acquired':'');
      if(got && category==='animals' && knownAnimalImages.has(id)){
        const img=document.createElement('img');img.className='item-image';img.src=`../assets/${id}.png`;img.alt=`どうぶつ ${id}`;cell.appendChild(img);
      }else{
        const mark=document.createElement('span');mark.className='placeholder';mark.textContent=got?'★':'○';mark.setAttribute('aria-hidden','true');cell.appendChild(mark);
      }
      const num=document.createElement('span');num.className='num';num.textContent=id;cell.appendChild(num);grid.appendChild(cell);
    }
    document.getElementById(progressId).textContent=`${valid} / ${count}`;
  }
  render('animalGrid','animalProgress','animals',50,'animal');
  render('dinoGrid','dinoProgress','dinosaurs',20,'dinosaur');
})();
</script>
</body>
</html>
